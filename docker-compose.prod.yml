# Production compose - extends base docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    ports: []

  nginx:
    container_name: astana-nginx
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx/bitrix-chat.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
