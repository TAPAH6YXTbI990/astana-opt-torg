services:
  app:
    build: .
    expose:
      - "8000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .bitrix:/app/.bitrix
      - ./knowledge_index:/app/knowledge_index
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
