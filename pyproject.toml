[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitrix-chat"
version = "0.1.0"
description = "Webhook bot for Bitrix24 chats"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "fast-bitrix24>=1.8.12",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bitrix-register-bot = "bitrix_chat.register_bot:main"
bitrix-bind-openlines = "bitrix_chat.bind_openlines:main"
